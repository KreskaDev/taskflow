name: ci

on:
  push:
    branches: [main, 'release/**']
  pull_request:
  # On-demand full regression run for any branch during development:
  #   gh workflow run ci.yml --ref <branch>   (or the Actions tab "Run workflow" button)
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/kreskadev/taskflow

jobs:
  # Regression-test-first gate (docs/bugfix-workflow.md): every fix(NNN) commit must be
  # preceded in the same PR/push range by a test(NNN) commit that touches test files —
  # the red repro exists before the fix. Scope-less `fix:` commits require any earlier
  # test commit touching test files; non-slice scopes (e.g. fix(deps)) are exempt.
  # Escape hatch for genuinely untestable fixes: a "Repro-Test: none — <why>" line in
  # the commit body passes the gate but surfaces as a warning annotation for review.
  bugfix-gate:
    name: bugfix regression-test-first
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify fix commits pair with an earlier repro-test commit
        env:
          RANGE: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || github.event_name == 'workflow_dispatch' && 'origin/main..HEAD' || format('{0}..{1}', github.event.before, github.sha) }}
        run: |
          set -euo pipefail
          if [[ "$RANGE" == 0000000000000000000000000000000000000000..* ]]; then
            echo "New branch push — no commit range to check."; exit 0
          fi
          declare -A repro_ok
          repro_any=0
          fail=0
          while read -r sha; do
            subject=$(git log -1 --format=%s "$sha")
            if [[ "$subject" =~ ^test(\(([0-9]{3})\))?[:!] ]]; then
              tslice="${BASH_REMATCH[2]:-}"
              if git diff-tree --no-commit-id --name-only -r "$sha" | grep -qE '^apps/(api|web)/tests/'; then
                repro_any=1
                [[ -n "$tslice" ]] && repro_ok["$tslice"]=1
              fi
            elif [[ "$subject" =~ ^fix(\(([0-9]{3})\))?[:!] ]]; then
              slice="${BASH_REMATCH[2]:-}"
              body=$(git log -1 --format=%b "$sha")
              if [[ -n "$slice" && "${repro_ok[$slice]:-}" == "1" ]] || [[ -z "$slice" && "$repro_any" == "1" ]]; then
                echo "OK: ${sha:0:9} $subject — earlier repro-test commit present"
              elif grep -q '^Repro-Test: none' <<<"$body"; then
                echo "::warning::${sha:0:9} $subject — no repro test, justified in commit body: $(grep -m1 '^Repro-Test:' <<<"$body")"
              else
                echo "::error::${sha:0:9} $subject violates regression-test-first (docs/bugfix-workflow.md): no earlier test(${slice:-...}) commit touching apps/api/tests/ or apps/web/tests/ in this range, and no 'Repro-Test: none — <why>' justification in the commit body."
                fail=1
              fi
            fi
          done < <(git rev-list --reverse --no-merges "$RANGE")
          exit $fail

  web-quality:
    name: web lint + typecheck + unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @taskflow/web lint
      - run: pnpm --filter @taskflow/web typecheck
      - run: pnpm --filter @taskflow/web test
      # Dead-code gate (slice 019, T065/D14 — §J3.7): zero unreferenced UI-layer modules.
      - run: pnpm --filter @taskflow/web audit:dead

  # Playwright E2E in CI (slice 019, D14): without this job the inventory/S2.4 gate and
  # every [E]/[A]/[V] exit criterion would be advisory-only. The harness self-boots its
  # whole stack exactly as locally: disposable Postgres :55432 (docker), the BUILT Debug
  # API on :4311, the fake IdP :4321, and the Next BFF :3000 (tests/e2e/global-setup.ts).
  web-e2e:
    name: web e2e (Playwright, self-booted stack)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: pnpm install --frozen-lockfile
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      # globalSetup runs the built bin/Debug/net9.0/TaskFlow.Api.dll directly.
      - run: dotnet build apps/api/src/TaskFlow.Api -c Debug
      - run: pnpm --filter @taskflow/web e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7

  api-quality:
    name: api build + test (xUnit + Testcontainers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore apps/api/TaskFlow.sln
      # Analyzers-as-errors enforced via Directory.Build.props (Constitution VI).
      - run: dotnet build apps/api/TaskFlow.sln -c Release --no-restore
      - run: dotnet test apps/api/tests/TaskFlow.UnitTests -c Release --no-build

  # The integration suite boots a THROWAWAY Postgres container + a full API host PER TEST
  # (IAsyncLifetime per fact). The whole 004–009 suite is ~200+ container create/start/stop cycles —
  # one GitHub runner's Docker daemon degrades under that churn until a container START times out
  # (Docker.DotNet TaskCanceledException ~11 min in) and the test host dies (MSB4166). Sharding
  # across FRESH runners keeps each daemon under ~60 cycles. The shard filters are COMPLEMENTS
  # (contains vs the same list negated), so a future test class always lands in exactly one shard —
  # nothing can silently drop out of CI. The integration assembly's xunit.runner.json additionally
  # caps in-process parallelism at 2 (7 GB runner memory).
  api-integration:
    name: api integration (${{ matrix.shard.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard:
          - name: comments
            filter: "FullyQualifiedName~IntegrationTests.Comments"
          - name: cycles
            filter: "FullyQualifiedName~IntegrationTests.Cycles"
          - name: identity-labels-infra
            filter: "FullyQualifiedName!~IntegrationTests.Comments&FullyQualifiedName!~IntegrationTests.Cycles&FullyQualifiedName!~IntegrationTests.TaskManagement"
          - name: tasks-core
            filter: "FullyQualifiedName~IntegrationTests.TaskManagement&FullyQualifiedName!~ChangeMemberRole&FullyQualifiedName!~GetProjectMembers&FullyQualifiedName!~InviteMember&FullyQualifiedName!~LeaveProject&FullyQualifiedName!~RemoveMember&FullyQualifiedName!~RoleOperationDenyMatrix&FullyQualifiedName!~SharedProjectReadAccess&FullyQualifiedName!~ShareUnshareProject&FullyQualifiedName!~TransferOwnership&FullyQualifiedName!~SetTaskAssignees&FullyQualifiedName!~GetAssignedToMe&FullyQualifiedName!~TaskAssigneesEagerLoad&FullyQualifiedName!~AssignmentCleanup&FullyQualifiedName!~SetTaskDoneSharedAuthz&FullyQualifiedName!~MoveTaskToProject&FullyQualifiedName!~InboxAndProjectTasks&FullyQualifiedName!~SetPriority&FullyQualifiedName!~RescheduleDueDate&FullyQualifiedName!~EditTask&FullyQualifiedName!~GetUpcoming&FullyQualifiedName!~DailyViewsDst&FullyQualifiedName!~GetTodayTasks&FullyQualifiedName!~GetMyTasks&FullyQualifiedName!~SetTaskDoneTests"
          - name: tasks-daily-triage
            filter: "FullyQualifiedName~IntegrationTests.TaskManagement&(FullyQualifiedName~SetPriority|FullyQualifiedName~RescheduleDueDate|FullyQualifiedName~EditTask|FullyQualifiedName~GetUpcoming|FullyQualifiedName~DailyViewsDst|FullyQualifiedName~GetTodayTasks|FullyQualifiedName~GetMyTasks|FullyQualifiedName~SetTaskDoneTests)"
          - name: sharing-assignment
            filter: "FullyQualifiedName~IntegrationTests.TaskManagement&(FullyQualifiedName~ChangeMemberRole|FullyQualifiedName~GetProjectMembers|FullyQualifiedName~InviteMember|FullyQualifiedName~LeaveProject|FullyQualifiedName~RemoveMember|FullyQualifiedName~RoleOperationDenyMatrix|FullyQualifiedName~SharedProjectReadAccess|FullyQualifiedName~ShareUnshareProject|FullyQualifiedName~TransferOwnership|FullyQualifiedName~SetTaskAssignees|FullyQualifiedName~GetAssignedToMe|FullyQualifiedName~TaskAssigneesEagerLoad|FullyQualifiedName~AssignmentCleanup|FullyQualifiedName~SetTaskDoneSharedAuthz|FullyQualifiedName~MoveTaskToProject|FullyQualifiedName~InboxAndProjectTasks)"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore apps/api/TaskFlow.sln
      - run: dotnet build apps/api/TaskFlow.sln -c Release --no-restore
      - run: dotnet test apps/api/tests/TaskFlow.IntegrationTests -c Release --no-build --filter "${{ matrix.shard.filter }}"
        timeout-minutes: 30

  openapi-sync:
    name: openapi client in sync
    runs-on: ubuntu-latest
    needs: [api-quality]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: taskflow
          POSTGRES_PASSWORD: taskflow
          POSTGRES_DB: taskflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taskflow"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: pnpm install --frozen-lockfile
      # Boot the real API against the Postgres service (it migrates + serves the live contract),
      # regenerate the typed client from /openapi/v1.json, and fail on drift.
      - name: Regenerate + diff OpenAPI client
        env:
          ConnectionStrings__postgres: Host=localhost;Port=5432;Database=taskflow;Username=taskflow;Password=taskflow
          Jwt__SigningKey: ci-openapi-sync-signing-key-0123456789abcdef
          ASPNETCORE_URLS: http://localhost:4311
          # Match how the committed client was generated (the doc is env-independent, but this removes
          # any drift variable from the git-diff gate).
          ASPNETCORE_ENVIRONMENT: Development
        run: |
          dotnet run --project apps/api/src/TaskFlow.Api --no-launch-profile &
          API_PID=$!
          # `http-get://` forces a GET — the OpenAPI minimal endpoint only handles GET, so a default
          # wait-on HEAD request would 405 and never see the document.
          npx --yes wait-on http-get://localhost:4311/openapi/v1.json -t 60000
          pnpm --filter @taskflow/web gen:api
          kill $API_PID || true
          git diff --exit-code apps/web/src/lib/api/generated/

  build-push:
    name: build + push images
    runs-on: ubuntu-latest
    needs: [bugfix-gate, web-quality, web-e2e, api-quality, api-integration, openapi-sync]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build + push api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.api
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-api:${{ github.sha }}
      - name: Build + push web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.web
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-web:${{ github.sha }}

  deploy:
    name: deploy (main only)
    runs-on: ubuntu-latest
    needs: [build-push]
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/taskflow
            export IMAGE_TAG=${{ github.sha }}
            ./scripts/backup.sh                       # pre-migration backup (Constitution VII)
            docker compose -f docker/docker-compose.yml pull
            docker compose -f docker/docker-compose.yml run --rm api dotnet TaskFlow.Api.dll --migrate
            ./scripts/restore-test.sh "$(ls -t /var/backups/taskflow/*.dump | head -1)"
            docker compose -f docker/docker-compose.yml up -d
